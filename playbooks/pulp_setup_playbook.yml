---

# Play 1: Pre-checks
- name: Run pre-checks
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Check ansible version is greater than 2.16.1
      ansible.builtin.fail:
        msg: >-
          Unsupported ansible-core version: {{ ansible_version.full }}.
          This playbook requires ansible-core 2.16.1 or higher.
      when: not (ansible_version.full is version('2.16.1', '>='))
      tags: always

    - name: Check OS is RHEL 9.5+ or RHEL 10
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'RedHat'
          - ansible_distribution_major_version in ['9', '10']
          - ansible_distribution_version is version('9.5', '>=')
        success_msg: "{{ ansible_distribution }} {{ ansible_distribution_version }} is the detected operating system."
        fail_msg: "This role supports RHEL 9.5+ and RHEL 10 only, detected {{ ansible_distribution }} {{ ansible_distribution_version }}."

# Play 2: Pulp server setup
- name: Deploy the Pulp server
  hosts: pulp_servers
  become: true
  tasks:
    - name: Import Pulp Setup Role
      ansible.builtin.include_role:
        name: pulp_setup
        apply:
          tags: pulp_setup
      tags: pulp_setup
